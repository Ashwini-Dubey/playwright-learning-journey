name: Playwright Tests

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]
  workflow_dispatch:

jobs:
  # Regular Playwright UI/API Tests
  test:
    name: Regular Playwright Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test
        env:
          CI: true
          RS_USERNAME: ${{ secrets.RS_USERNAME }}
          RS_PASSWORD: ${{ secrets.RS_PASSWORD }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 30

  # Playwright BDD Tests
  bdd-test:
    name: Playwright BDD Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Generate BDD Tests
        run: npm run bdd:generate

      - name: Execute BDD Tests
        run: npx playwright test --config playwright-bdd.config.js
        env:
          CI: true
          RS_USERNAME: ${{ secrets.RS_USERNAME }}
          RS_PASSWORD: ${{ secrets.RS_PASSWORD }}

      - name: Upload BDD report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-bdd-report
          path: |
            playwright-report/
            test-results/
            .features-gen/
          retention-days: 30
